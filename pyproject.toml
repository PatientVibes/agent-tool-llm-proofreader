[project]
name = "agent-tool-llm-proofreader"
version = "0.1.1"
description = "LLM-powered OCR proofreading agent. Deterministic pre-pass + langchain-openai verifier (via OpenRouter)."
authors = [{ name = "Chris Moore", email = "chris.paul.moore@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=2,<3",
    "nltk>=3.9,<4",
    "platformdirs>=4,<5",
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "PyPDF2>=3,<4",
]

[project.scripts]
llm-proofreader = "llm_proofreader.proofreader:main"
llm-proofreader-graph = "llm_proofreader.proofreader_graph:main"
crop-flagged-blocks = "llm_proofreader.crop_flagged_blocks:main"
reinsert-blocks = "llm_proofreader.reinsert_blocks:main"
split-and-process = "llm_proofreader.split_and_process:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_proofreader"]

[tool.hatch.build.targets.wheel.shared-data]
"state/memory.json" = "share/agent-tool-llm-proofreader/memory.json.example"
